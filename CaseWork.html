<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue Management System</title>
<style>
:root{--accent:#2563eb;--accent-d:#1d4ed8;--bg:#f3f5fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
h1,h2,h3{margin:0 0 .6em}
h2{font-size:1.15rem}h3{font-size:1rem;margin-top:1.2em}
.muted{color:var(--muted);font-size:.88rem}
/* header */
.top{display:flex;align-items:center;gap:16px;background:#0f172a;color:#fff;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px;font-size:1.05rem}
.brand small{display:block;font-weight:500;color:#94a3b8;font-size:.72rem;letter-spacing:.5px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;color:#cbd5e1;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.nav button:hover{background:#1e293b;color:#fff}
.nav button.on{background:var(--accent);color:#fff}
.top .sp{flex:1}
.clock{font-variant-numeric:tabular-nums;color:#cbd5e1;font-size:.9rem;text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.open{background:#dcfce7;color:#166534}.pill.closed{background:#fee2e2;color:#991b1b}
.who{font-size:.85rem;color:#e2e8f0}
.who b{color:#fff}
main{padding:20px;max-width:1500px;margin:0 auto}
/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.row2,.row3,.row4{display:grid;gap:12px;margin-bottom:12px}
.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}.row4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.row3,.row4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.row2,.row3,.row4{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:#334155}
input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
input[readonly]{background:#f1f5f9;color:#475569}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500}
label.chk input{width:17px;height:17px}
.btn{border:1px solid #cbd5e1;background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{padding:13px 20px;font-size:1.05rem;width:100%}
.btn.sm{padding:4px 9px;font-size:.8rem;border-radius:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:1.45rem;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f8fafc;font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;color:#475569;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num{font-weight:800;font-family:ui-monospace,Consolas,monospace;font-size:.95rem;letter-spacing:.5px}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700}
.st-Waiting{background:#e0f2fe;color:#075985}.st-Called{background:#fef3c7;color:#92400e}.st-Serving{background:#ede9fe;color:#5b21b6}
.st-Completed{background:#dcfce7;color:#166534}.st-NoShow{background:#fee2e2;color:#991b1b}.st-Cancelled{background:#e2e8f0;color:#334155}
.pr{font-size:.72rem;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:1px 6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label{min-width:150px}
/* ticket result */
.tk-result{border:2px dashed #94a3b8;border-radius:12px;padding:18px;text-align:center;background:#f8fafc}
.tk-result .n{font-size:3rem;font-weight:900;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--accent)}
/* operator */
.op{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:18px;margin-bottom:18px}
@media(max-width:980px){.op{grid-template-columns:1fr}}
.cur{border-radius:12px;padding:18px;text-align:center;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.cur .n{font-size:3.2rem;font-weight:900;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px}
.cur .s{color:#cbd5e1;font-size:.9rem}
.cb-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(170px,1.3fr) 90px auto;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}.cb-row:last-child{border-bottom:0}
.cb-row.mine{background:#f8fafc}.cb-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:760px){.cb-row{grid-template-columns:1fr 1fr}.cb-b{grid-column:1/-1;justify-content:flex-start}}
.opbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opbtns .btn{padding:14px 10px;font-size:.95rem;white-space:normal}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#94a3b8;margin-right:6px}
.dot.on{background:#22c55e}
.nextup{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nextup span{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
/* settings */
.set-sec{margin-bottom:18px}
.list-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.list-row input[type=text]{flex:1;min-width:160px}
.cs{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;padding:6px 0 4px 4px}
.cs label{flex-direction:row;align-items:center;gap:5px;font-weight:500}
.savebar{position:sticky;bottom:0;background:rgba(243,245,250,.95);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:10px}
.help{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 12px;font-size:.84rem;margin:8px 0}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.login .card{width:100%;max-width:400px;padding:28px}
.login h1{font-size:1.35rem}
/* chart */
.chart{width:100%;height:220px}
/* ===== PUBLIC DISPLAY ===== */
body.display{background:#0b1220;color:#fff;overflow:hidden}
.dsp{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.4vh;padding:1.6vh 1.8vw}
.dsp.light{background:#f8fafc;color:#0f172a}
.dsp-h{display:flex;justify-content:space-between;align-items:center}
.dsp-biz{font-size:clamp(20px,2.6vw,48px);font-weight:900;letter-spacing:1px;text-transform:uppercase}
.dsp-clock{text-align:right;font-variant-numeric:tabular-nums}
.dsp-clock .t{font-size:clamp(22px,3vw,54px);font-weight:800;display:block}
.dsp-clock .d{font-size:clamp(13px,1.3vw,24px);opacity:.75}
.dsp-main{display:grid;grid-template-columns:1.45fr 1fr;gap:1.6vw;min-height:0}
.dsp-left{display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.dsp-left .dsp-now{flex:1}
.dsp-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:2vh 1.6vw;min-height:0;overflow:hidden}
.dsp.light .dsp-panel{background:#fff;border-color:#e2e8f0}
.dsp-lbl{font-size:clamp(14px,1.6vw,30px);font-weight:800;letter-spacing:3px;opacity:.75;text-transform:uppercase}
.dsp-now{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dsp-num{white-space:nowrap;font-size:clamp(48px,9vw,230px);font-weight:900;font-family:ui-monospace,Consolas,"Courier New",monospace;letter-spacing:.04em;line-height:1.05;color:var(--accent);text-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.dsp-proceed{font-size:clamp(16px,2vw,38px);font-weight:800;letter-spacing:3px;opacity:.8;margin-top:1vh}
.dsp-counter{font-size:clamp(34px,5.2vw,110px);font-weight:900;color:#facc15;line-height:1.1}
.dsp.light .dsp-counter{color:#b45309}
.dsp-svc{font-size:clamp(14px,1.5vw,28px);opacity:.7;margin-top:.6vh}
.dsp-now.flash{animation:flash 1s ease-in-out 5}
@keyframes flash{0%,100%{background:rgba(255,255,255,.06)}50%{background:color-mix(in srgb,var(--accent) 40%,transparent)}}
.dsp-ctr{display:flex;justify-content:space-between;align-items:center;padding:1.1vh .6vw;border-bottom:1px solid rgba(255,255,255,.1);font-size:clamp(16px,1.9vw,38px);font-weight:700}
.dsp.light .dsp-ctr{border-color:#e2e8f0}
.dsp-ctr .cn{font-family:ui-monospace,Consolas,monospace;font-weight:900;color:var(--accent)}
.dsp-ctr .cs2{font-size:.55em;opacity:.65;display:block;font-weight:600}
.dsp-wait{display:flex;flex-direction:column}
.dsp-whead,.dsp-wrow{display:grid;grid-template-columns:auto 1fr auto;gap:1vw;align-items:center}
.dsp-whead{font-size:clamp(11px,1vw,18px);font-weight:700;letter-spacing:2px;opacity:.55;text-transform:uppercase;padding:1vh .8vw .6vh}
.dsp-wlist{display:flex;flex-direction:column;gap:.8vh;min-height:0;overflow:hidden}
.dsp-wrow{background:rgba(255,255,255,.08);border-radius:12px;padding:.9vh .8vw;font-size:clamp(16px,1.9vw,38px)}
.dsp.light .dsp-wrow{background:#f1f5f9}
.dsp-wrow .wn{font-family:ui-monospace,Consolas,monospace;font-weight:900;letter-spacing:.03em}
.dsp-wrow .ws{font-size:.5em;opacity:.65;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsp-wrow .wt{font-weight:800;color:#facc15;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.dsp.light .dsp-wrow .wt{color:#b45309}
.dsp-wrow .wt small{display:block;font-size:.42em;font-weight:600;opacity:.75;color:inherit}
.dsp-ctrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8vh .8vw}
.dsp-ctrs.hide{display:none}
.dsp-cbox{border-radius:12px;padding:1vh .8vw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:clamp(14px,1.4vw,28px);font-weight:700}
.dsp.light .dsp-cbox{background:#fff;border-color:#e2e8f0}
.dsp-cbox .cs3{display:block;font-size:.7em;font-weight:800;margin-top:.3vh}
.dsp-cbox.free .cs3{color:#22c55e}
.dsp-cbox.busy .cs3{color:var(--accent);font-family:ui-monospace,Consolas,monospace}
.dsp-empty{opacity:.55;font-size:clamp(16px,1.8vw,32px);padding:1vh 0}
.dsp-info{display:flex;gap:2vw;align-items:center;background:rgba(255,255,255,.06);border-radius:16px;padding:1.2vh 1.4vw;font-size:clamp(14px,1.6vw,30px);font-weight:700;overflow:hidden}
.dsp.light .dsp-info{background:#e2e8f0}
.dsp-info b{color:#facc15}.dsp.light .dsp-info b{color:#b45309}
.ticker{flex:1;overflow:hidden;white-space:nowrap;opacity:.85;font-weight:500}
.ticker span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.dsp-banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;padding:4vh 4vw;border-radius:28px;font-size:clamp(26px,4vw,80px);font-weight:900;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:50;max-width:90vw}
.dsp-banner small{display:block;font-size:.45em;font-weight:700;opacity:.9;margin-top:1vh}
.dsp-unlock{position:fixed;inset:0;background:rgba(2,6,23,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:60;text-align:center;padding:20px}
.dsp-unlock button{font-size:1.4rem;padding:18px 36px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
.dsp-tools{position:fixed;right:10px;bottom:10px;opacity:0;transition:opacity .3s;z-index:40}
.dsp-tools:hover{opacity:1}
.dsp-tools button{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:8px;padding:6px 10px;cursor:pointer}
@media(max-width:800px){.dsp-main{grid-template-columns:1fr}body.display{overflow:auto}.dsp{height:auto;min-height:100vh}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<iframe id="printFrame" title="print" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden"></iframe>
<script>
'use strict';
/* =====================================================================
   QUEUE MANAGEMENT SYSTEM — single-file application
   Storage: IndexedDB (atomic transactions, unique [day, seq] index)
   Real-time: BroadcastChannel + storage-event fallback + safety polling
   ===================================================================== */
const STATUSES=['Waiting','Called','Serving','Completed','No Show','Cancelled'];
const ROLES={admin:'Administrator',frontdesk:'Front Desk',operator:'Queue Operator',display:'Public Display'};
const PERMS={
  admin:['register','reprint','viewQueue','operate','reports','settings','logs','viewPII'],
  frontdesk:['register','reprint','viewQueue','viewPII'],
  operator:['viewQueue','operate'],
  display:[]
};
const browserTZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}})();
const DEFAULTS={
  systemName:'Queue Management System',
  businessName:'QUEUE MANAGEMENT SYSTEM',
  timezone:browserTZ,
  hours:{open:'08:00',close:'17:00',days:[1,2,3,4,5],outsideHours:'warn'},
  numbering:{digits:4,padChar:'X',dailyReset:true},
  printer:{paper:'80',autoPrint:true,copies:1,showService:false,line1:'Please wait until your number is called.',line2:'Thank you for your patience.'},
  services:[
    {id:'svc1',name:'General Inquiry',active:true},
    {id:'svc2',name:'Applications',active:true},
    {id:'svc3',name:'Payments',active:true},
    {id:'svc4',name:'Customer Service',active:true}
  ],
  priorities:[
    {id:'pri0',name:'Regular',rank:0},
    {id:'pri1',name:'Priority (Senior / PWD / Pregnant)',rank:1}
  ],
  counters:[
    {id:'ctr1',name:'Counter 1',services:[]},
    {id:'ctr2',name:'Counter 2',services:[]}
  ],
  display:{theme:'dark',accent:'#3b82f6',maxWaiting:10,showService:true,showEstimate:true,showCounters:true,ticker:'Welcome! Please keep your ticket ready and watch this screen for your number.'},
  announce:{enabled:true,target:'display',voice:'',volume:1,rate:0.9,repeat:1,chime:true,spell:true,template:'Queue number {number}, please proceed to {counter}.'},
  estimate:{method:'service',defaultMinutes:5},
  security:{autoLogoutMin:30,operatorSeesName:true}
};

/* ---------------- state ---------------- */
const S={
  settings:null,tickets:[],users:[],user:null,view:null,
  counterId:sessionStorage.getItem('qms_counter')||'',
  isDisplay:location.hash==='#display',
  displayBeat:0,displayAudio:false,
  lastResult:null,lastActivity:Date.now(),currentDay:null,report:null
};
let db,D=null; // D = settings draft
const app=document.getElementById('app');

/* ---------------- utilities ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const tz=()=>(S.settings&&S.settings.timezone)||browserTZ;
function parts(ms){
  const o={};
  try{
    new Intl.DateTimeFormat('en-US',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(ms).forEach(x=>o[x.type]=x.value);
  }catch(e){const d=new Date(ms);o.year=d.getFullYear();o.month=String(d.getMonth()+1).padStart(2,'0');o.day=String(d.getDate()).padStart(2,'0');o.hour=String(d.getHours());o.minute=String(d.getMinutes());o.weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}
  return o;
}
const dayKey=(ms=Date.now())=>{const p=parts(ms);return `${p.year}-${p.month}-${p.day}`};
const fmtDate=ms=>{const p=parts(ms);return `${p.month}/${p.day}/${p.year}`};
const fmtTime=ms=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:tz(),hour:'numeric',minute:'2-digit',hour12:true}).format(ms)}catch(e){return new Date(ms).toLocaleTimeString()}};
const fmtTimeS=ms=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:tz(),hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(ms)}catch(e){return new Date(ms).toLocaleTimeString()}};
const fmtLongDate=ms=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:tz(),weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(ms)}catch(e){return new Date(ms).toDateString()}};
const dayLabel=k=>{const [y,m,d]=k.split('-');return `${m}/${d}/${y}`};
const minutesOfDay=ms=>{const p=parts(ms);return (+p.hour%24)*60+(+p.minute)};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDur(ms){
  if(ms==null||isNaN(ms))return '—';
  const m=Math.max(0,Math.floor(ms/60000));
  if(m<60)return m+' min';
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const max=a=>a.length?Math.max(...a):null;
const mins=ms=>ms==null?'':Math.round(ms/6000)/10;
function toast(msg,type){
  const el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),type==='err'?6000:3500);
}
function modal(html,onMount){
  closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg)closeModal()});
  document.body.appendChild(bg);
  if(onMount)onMount(bg);
  return bg;
}
function closeModal(){const m=$('#modalBg');if(m)m.remove()}
const can=p=>!!S.user&&(PERMS[S.user.role]||[]).includes(p);
const counterById=id=>S.settings.counters.find(c=>c.id===id);
const serviceById=id=>S.settings.services.find(s=>s.id===id);
const activeServices=()=>S.settings.services.filter(s=>s.active!==false);
const stClass=s=>'st st-'+String(s).replace(/\s/g,'');

/* ---------------- database ---------------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('qms_database',1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      const t=d.createObjectStore('tickets',{keyPath:'id'});
      t.createIndex('daySeq',['day','seq'],{unique:true});   // guarantees no duplicate numbers per day
      t.createIndex('day','day');
      t.createIndex('status','status');
      d.createObjectStore('meta',{keyPath:'key'});           // settings + counter
      const u=d.createObjectStore('users',{keyPath:'id'});
      u.createIndex('username','username',{unique:true});
      const l=d.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      l.createIndex('day','day');
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>toast('Close other copies of the system to finish upgrading the database.','err');
  });
}
function idb(store,mode,op){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode);const s=t.objectStore(store);let v;
    const r=op(s);if(r)r.onsuccess=()=>{v=r.result};
    t.oncomplete=()=>res(v);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'));
  });
}

const dbIndex=(st,ix,range)=>idb(st,'readonly',s=>s.index(ix).getAll(range));

async function hashPin(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  if(window.crypto&&crypto.subtle){
    try{const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
  }
  let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)}
  return 'f'+(h>>>0).toString(16);
}

/* ---------------- queue numbering ---------------- */
function prefixFrom(last){
  const pad=((S.settings.numbering.padChar||'X')+'').toUpperCase().replace(/[^A-Z]/g,'').charAt(0)||'X';
  const letters=String(last||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();
  return letters.slice(0,3).padEnd(3,pad);
}
const formatNumber=(prefix,seq)=>prefix+'-'+String(seq).padStart(Math.max(4,+S.settings.numbering.digits||4),'0');

/* Atomic ticket creation: one readwrite transaction over meta+tickets.
   IndexedDB serialises overlapping readwrite transactions across all tabs/windows,
   and the unique [day,seq] index rejects any duplicate as a last line of defence. */
function createTicket(data){
  const day=dayKey(),now=Date.now(),reset=!!S.settings.numbering.dailyReset;
  return new Promise((res,rej)=>{
    const t=db.transaction(['meta','tickets','logs'],'readwrite');
    const meta=t.objectStore('meta'),tk=t.objectStore('tickets');let ticket=null;
    meta.get('counter').onsuccess=e=>{
      const c=e.target.result||{key:'counter',day,seq:0};
      if(reset&&c.day!==day)c.seq=0;         // new business day → restart at 0001
      c.day=day;
      const next=()=>{
        c.seq++;
        tk.index('daySeq').getKey([day,c.seq]).onsuccess=ev=>{
          if(ev.target.result!==undefined)return next(); // already used → skip
          const prefix=prefixFrom(data.last);
          const pri=S.settings.priorities.find(p=>p.id===data.priority)||S.settings.priorities[0];
          const svc=serviceById(data.service);
          ticket={
            id:uid('t'),day,seq:c.seq,prefix,number:formatNumber(prefix,c.seq),
            client:{first:data.first,middle:data.middle,last:data.last,phone:data.phone},
            serviceId:svc.id,serviceName:svc.name,
            priorityId:pri.id,priorityName:pri.name,priorityRank:+pri.rank||0,
            status:'Waiting',registeredAt:now,
            registeredBy:S.user.id,registeredByName:S.user.name,
            calledAt:null,lastCalledAt:null,waitMs:null,servingAt:null,completedAt:null,serviceMs:null,
            counterId:null,counterName:null,callCount:0,printCount:0,
            history:[{at:now,action:'Registered',by:S.user.name}]
          };
          tk.add(ticket);meta.put(c);
          t.objectStore('logs').add({at:now,day,userId:S.user.id,userName:S.user.name,action:'Registered / Ticket generated',number:ticket.number,detail:svc.name});
        };
      };
      next();
    };
    t.oncomplete=()=>res(ticket);
    t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Ticket could not be created'));
  });
}

/* Generic atomic ticket operation against today's tickets */
function ticketTx(mutator){
  return new Promise((res,rej)=>{
    const t=db.transaction(['tickets','logs'],'readwrite');const st=t.objectStore('tickets');let out=null;
    st.index('day').getAll(IDBKeyRange.only(dayKey())).onsuccess=e=>{
      const r=mutator(e.target.result);
      if(!r||r.error){out=r||{error:'Nothing to do.'};return}
      const now=Date.now();
      r.ticket.history=r.ticket.history||[];
      r.ticket.history.push({at:now,action:r.action,by:S.user.name,detail:r.detail||''});
      r.ticket.updatedAt=now;
      st.put(r.ticket);
      t.objectStore('logs').add({at:now,day:dayKey(now),userId:S.user.id,userName:S.user.name,action:r.action,number:r.ticket.number,detail:r.detail||''});
      out=r;
    };
    t.oncomplete=()=>out&&out.error?rej(new Error(out.error)):res(out);
    t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Operation failed'));
  });
}

/* End-of-day: close tickets left open from a previous business day */
async function closeStale(){
  const today=dayKey();let open=[];
  for(const st of ['Waiting','Called','Serving'])open=open.concat(await dbIndex('tickets','status',IDBKeyRange.only(st)));
  const stale=open.filter(t=>t.day<today);
  if(!stale.length)return;
  await new Promise((res,rej)=>{
    const t=db.transaction(['tickets','logs'],'readwrite');const st=t.objectStore('tickets'),lg=t.objectStore('logs');const now=Date.now();
    stale.forEach(tk=>{
      const from=tk.status;
      if(from==='Waiting'){tk.status='Cancelled';tk.cancelReason='Auto-closed at end of business day'}
      else if(from==='Called'){tk.status='No Show'}
      else{tk.status='Completed';tk.completedAt=tk.servingAt;tk.serviceMs=null}
      tk.autoClosed=true;
      tk.history.push({at:now,action:'Auto-closed ('+from+' → '+tk.status+')',by:'System'});
      st.put(tk);
      lg.add({at:now,day:dayKey(now),userId:'system',userName:'System',action:'Auto-closed at end of day',number:tk.number,detail:from+' → '+tk.status});
    });
    t.oncomplete=res;t.onerror=()=>rej(t.error);
  });
  notify({type:'changed'});
}

/* ---------------- queue logic ---------------- */
const rankOf=t=>{const p=S.settings.priorities.find(p=>p.id===t.priorityId);return p?(+p.rank||0):(t.priorityRank||0)};
const queueSort=(a,b)=>rankOf(b)-rankOf(a)||a.registeredAt-b.registeredAt||a.seq-b.seq;
function activeFor(list,cid){
  return list.filter(t=>t.counterId===cid&&(t.status==='Called'||t.status==='Serving')).sort((a,b)=>b.lastCalledAt-a.lastCalledAt)[0]||null;
}
function eligible(list,cid){
  const c=counterById(cid);
  return list.filter(t=>t.status==='Waiting'&&(!c||!c.services||!c.services.length||c.services.includes(t.serviceId))).sort(queueSort);
}
function waitingOf(t,now=Date.now()){return t.status==='Waiting'?now-t.registeredAt:t.waitMs}
function computeStats(list,now=Date.now()){
  const by=s=>list.filter(t=>t.status===s).length;
  const waiting=list.filter(t=>t.status==='Waiting');
  const frozen=list.filter(t=>t.waitMs!=null).map(t=>t.waitMs);
  const live=waiting.map(t=>now-t.registeredAt);
  const svc=list.filter(t=>t.serviceMs!=null).map(t=>t.serviceMs);
  return{total:list.length,waiting:waiting.length,called:by('Called'),serving:by('Serving'),completed:by('Completed'),noShow:by('No Show'),cancelled:by('Cancelled'),
    avgWait:avg(frozen),longestCurrent:max(live),longestToday:max(frozen.concat(live)),avgService:avg(svc)};
}
function estimateMs(){
  const e=S.settings.estimate,st=computeStats(S.tickets);
  const counters=Math.max(1,S.settings.counters.length);
  const def=(+e.defaultMinutes||5)*60000;
  if(e.method==='avgWait')return st.avgWait!=null?st.avgWait:st.waiting*def/counters;
  const per=e.method==='fixed'?def:(st.avgService!=null?st.avgService:def);
  return Math.round(st.waiting*per/counters);
}
function isOpenNow(){
  const h=S.settings.hours,now=Date.now(),p=parts(now);
  const wd=WD.indexOf(p.weekday);
  if(!(h.days||[]).map(Number).includes(wd))return false;
  const m=minutesOfDay(now);
  const [oh,om]=(h.open||'00:00').split(':').map(Number),[ch,cm]=(h.close||'23:59').split(':').map(Number);
  return m>=oh*60+om&&m<ch*60+cm;
}

/* ---------------- announcements ---------------- */
function spokenNumber(num){
  if(!S.settings.announce.spell)return num;
  const [p,n]=num.split('-');
  return p.split('').join(' ')+', '+(n||'').split('').join(' ');
}
function announceText(t){
  return (S.settings.announce.template||'Queue number {number}, please proceed to {counter}.')
    .replace(/\{number\}/g,spokenNumber(t.number)).replace(/\{counter\}/g,t.counterName||'the counter').replace(/\{service\}/g,t.serviceName||'');
}
function chime(vol){
  return new Promise(res=>{
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return res();
      S.ac=S.ac||new C();const ac=S.ac;ac.resume&&ac.resume();const t0=ac.currentTime+0.05;
      [[880,0],[660,0.38]].forEach(([f,d])=>{
        const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.45*vol+0.0001,t0+d+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.7);
        o.connect(g);g.connect(ac.destination);o.start(t0+d);o.stop(t0+d+0.75);
      });
      setTimeout(res,1150);
    }catch(e){res()}
  });
}
function speak(text){
  const a=S.settings.announce;if(!a.enabled)return;
  const vol=Math.max(0,Math.min(1,+a.volume));
  const go=()=>{
    if(!('speechSynthesis' in window))return;
    const v=speechSynthesis.getVoices().find(v=>v.name===a.voice);
    for(let i=0;i<Math.max(1,+a.repeat||1);i++){
      const u=new SpeechSynthesisUtterance(text);u.volume=vol;u.rate=+a.rate||0.9;
      if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
      speechSynthesis.speak(u);
    }
  };
  if(a.chime)chime(vol).then(go);else go();
}
function displayAlive(){return Date.now()-S.displayBeat<12000}
function announce(t){
  const a=S.settings.announce,text=announceText(t);
  notify({type:'announce',text,number:t.number,counter:t.counterName});
  if(!a.enabled)return;
  const localSpeak=a.target==='operator'||a.target==='both'||(a.target==='display'&&!(displayAlive()&&S.displayAudio));
  if(localSpeak)speak(text);
}

function ticketTxById(id,fn,anyDay){
  return new Promise((res,rej)=>{
    const t=db.transaction(['tickets','logs'],'readwrite');const st=t.objectStore('tickets');let out=null;
    st.get(id).onsuccess=e=>{
      const tk=e.target.result;if(!tk||(!anyDay&&tk.day!==dayKey())){out={error:'Ticket not found for today.'};return}
      const r=fn(tk);if(!r||r.error){out=r||{error:'Nothing to do.'};return}
      const now=Date.now();
      tk.history.push({at:now,action:r.action,by:S.user.name,detail:r.detail||''});tk.updatedAt=now;st.put(tk);
      t.objectStore('logs').add({at:now,day:dayKey(now),userId:S.user.id,userName:S.user.name,action:r.action,number:tk.number,detail:r.detail||''});
      out=r;
    };
    t.oncomplete=()=>out&&out.error?rej(new Error(out.error)):res(out);
    t.onerror=()=>rej(t.error);
  });
}

let loginFails=0,lockUntil=0;
function renderLogin(){
  document.body.className='';
  const users=S.users.filter(u=>u.active);
  const first=S.users.length===1&&S.users[0].mustChange;
  app.innerHTML=`<div class="login"><div class="card">
    <h1>${esc(bizName())}</h1>
    <p class="muted" style="margin-top:-6px">${esc(sysName())} — staff sign-in</p>
    <form id="loginForm">
      <label style="margin-bottom:12px">User
        <select name="user">${users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${ROLES[u.role]}</option>`).join('')}</select>
      </label>
      <label style="margin-bottom:16px">PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus></label>
      <button class="btn primary big" type="submit">Sign In</button>
    </form>
    ${first?`<div class="help">First-time setup: sign in as <b>Administrator</b> with PIN <b>1234</b>. You will be asked to choose a new PIN.</div>`:''}
    <p style="text-align:center;margin:16px 0 0"><a href="#display" id="openDsp" style="color:var(--accent);font-weight:600">Open Public Display (no sign-in, anonymous)</a></p>
  </div></div>`;
  $('#openDsp').onclick=e=>{e.preventDefault();openDisplayWindow()};
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();
    if(Date.now()<lockUntil)return toast('Too many attempts. Try again in a minute.','err');
    const f=e.target,u=S.users.find(x=>x.id===f.user.value);
    if(!u)return;
    if(await hashPin(f.pin.value,u.salt)!==u.pin){
      loginFails++;if(loginFails>=5){lockUntil=Date.now()+60000;loginFails=0}
      f.pin.value='';return toast('Incorrect PIN.','err');
    }
    loginFails=0;S.user=u;S.lastActivity=Date.now();
    sessionStorage.setItem('qms_session',JSON.stringify({id:u.id}));
    await addLog('Signed in');
    if(u.mustChange)return changePinModal(true);
    render();
  };
}

async function doOp(op){
  const cid=S.counterId,cname=(counterById(cid)||{}).name;
  if(!cid)return toast('Select your counter first.','err');
  let announceIt=false;
  try{
    let r;
    if(op==='next'){
      r=await ticketTx(list=>{
        const a=activeFor(list,cid);
        if(a)return{error:`${a.number} is still active at ${cname}. Complete it, mark No Show, or cancel it first.`};
        const t=eligible(list,cid)[0];if(!t)return{error:'No eligible clients are waiting for this counter.'};
        markCalled(t,cid);return{ticket:t,action:'Called',detail:cname};
      });announceIt=true;
    }else if(op==='again'){
      r=await ticketTx(list=>{const a=activeFor(list,cid);if(!a)return{error:'No active ticket to call again.'};
        a.lastCalledAt=Date.now();a.callCount=(a.callCount||0)+1;return{ticket:a,action:'Called again',detail:cname+' (call #'+a.callCount+')'}});announceIt=true;
    }else if(op==='serve'){
      r=await ticketTx(list=>{const a=activeFor(list,cid);if(!a||a.status!=='Called')return{error:'Call a ticket before starting service.'};
        a.status='Serving';a.servingAt=Date.now();a.servedBy=S.user.id;a.servedByName=S.user.name;return{ticket:a,action:'Service started',detail:cname}});
    }else if(op==='complete'){
      r=await ticketTx(list=>{const a=activeFor(list,cid);if(!a)return{error:'No active ticket to complete.'};
        const now=Date.now();if(!a.servingAt){a.servingAt=a.lastCalledAt||now;a.servedBy=S.user.id;a.servedByName=S.user.name}
        a.status='Completed';a.completedAt=now;a.serviceMs=now-a.servingAt;a.completedBy=S.user.id;a.completedByName=S.user.name;
        return{ticket:a,action:'Service completed',detail:cname+' · '+fmtDur(a.serviceMs)}});
    }else if(op==='noshow'){
      r=await ticketTx(list=>{const a=activeFor(list,cid);if(!a||a.status!=='Called')return{error:'Only a called ticket can be marked No Show.'};
        a.status='No Show';a.noShowAt=Date.now();return{ticket:a,action:'Marked No Show',detail:cname}});
    }else if(op==='cancel'){
      const a0=activeFor(S.tickets,cid);if(!a0)return toast('No active ticket to cancel.','err');
      const reason=prompt(`Cancel ticket ${a0.number}? Enter a reason (optional):`,'');if(reason===null)return;
      r=await ticketTx(list=>{const a=activeFor(list,cid);if(!a)return{error:'No active ticket to cancel.'};
        a.status='Cancelled';a.cancelledAt=Date.now();a.cancelReason=reason;return{ticket:a,action:'Cancelled',detail:reason}});
    }else if(op==='recall'){
      r=await ticketTx(list=>{
        const a=activeFor(list,cid);
        const prev=list.filter(t=>t.counterId===cid&&t.lastCalledAt&&(!a||t.id!==a.id)&&t.status!=='Cancelled').sort((x,y)=>y.lastCalledAt-x.lastCalledAt)[0];
        if(!prev)return{error:'There is no previous number at this counter to recall.'};
        if(prev.status==='No Show'){
          if(a)return{error:`Finish ${a.number} before recalling ${prev.number}.`};
          markCalled(prev,cid);return{ticket:prev,action:'Recalled (from No Show)',detail:cname};
        }
        prev.lastCalledAt=Date.now();prev.callCount=(prev.callCount||0)+1;
        return{ticket:prev,action:'Recalled previous number',detail:cname+' (announcement repeated)'};
      });announceIt=true;
    }
    await loadTickets();notify({type:'changed'});refreshQueue();
    if(r&&r.ticket){toast(r.ticket.number+': '+r.action,'ok');if(announceIt)announce(r.ticket)}
  }catch(e){toast(e.message,'err')}
}
/* Counters board: every counter with what it is doing, and buttons to act for it --
   e.g. a co-worker says "done": finish their client and call the next number to their counter. */
let cbBusy=false;
function renderCounterBoard(now=Date.now()){
  const box=$('#ctrBoardList');if(!box)return;
  const cs=S.settings.counters||[];
  if(!cs.length){box.innerHTML='<div class="muted">No counters yet. Add them in Settings.</div>';return}
  box.innerHTML=cs.map(c=>{
    const a=activeFor(S.tickets,c.id),wait=eligible(S.tickets,c.id).length,dis=cbBusy?' disabled':'';
    const state=!a?'<span class="pill open">Available</span>':
      `<span class="pill" style="background:${a.status==='Serving'?'#dbeafe;color:#1e3a8a':'#fef3c7;color:#92400e'}">${a.status==='Serving'?'Serving':'Called'} <b style="font-size:.95rem">${esc(a.number)}</b> · ${fmtDur(now-(a.servingAt||a.lastCalledAt||now))}</span>`;
    const btns=a?`<button class="btn ok sm" data-cb="donenext" data-c="${c.id}"${dis}${wait?'':' title="No one is waiting for this counter"'}>✔ Done – call next</button><button class="btn sm" data-cb="done" data-c="${c.id}"${dis}>✔ Done</button><button class="btn sm" data-cb="again" data-c="${c.id}"${dis}>🔊 Call again</button>`:
      `<button class="btn primary sm" data-cb="next" data-c="${c.id}"${wait?dis:' disabled title="No one is waiting for this counter"'}>▶ Call next</button>`;
    return `<div class="cb-row${c.id===S.counterId?' mine':''}"><div class="cb-n"><b>${esc(c.name)}</b>${c.id===S.counterId?' <span class="muted">(you)</span>':''}</div><div class="cb-s">${state}</div><div class="cb-w muted">${wait} waiting</div><div class="cb-b">${btns}</div></div>`;
  }).join('');
}
async function actForCounter(cid,ops){
  if(cbBusy||!counterById(cid))return;cbBusy=true;renderCounterBoard();
  const keep=S.counterId;
  try{
    S.counterId=cid;
    for(const op of ops){
      await doOp(op);
      if(op==='complete'&&activeFor(S.tickets,cid))break;   // could not finish: do not call anyone
    }
  }finally{S.counterId=keep;cbBusy=false;refreshQueue()}
}
function markCalled(t,cid){
  const now=Date.now(),c=counterById(cid);
  t.status='Called';
  if(t.calledAt==null){t.calledAt=now;t.waitMs=now-t.registeredAt} // waiting-time counter stops here; preserved in history
  t.lastCalledAt=now;t.counterId=cid;t.counterName=c?c.name:cid;t.callCount=(t.callCount||0)+1;
  t.calledBy=S.user.id;t.calledByName=S.user.name;
}
async function rowAction(kind,id){
  const t=S.tickets.find(x=>x.id===id);if(!t)return;
  if(kind==='print')return printTicket(t,true);
  if(kind==='details')return detailsModal(t);
  const cid=S.counterId,cname=(counterById(cid)||{}).name;
  try{
    let r,ann=false;
    if(kind==='call'||kind==='recallrow'){
      if(!cid)return toast('Select your counter first.','err');
      r=await ticketTx(list=>{
        const a=activeFor(list,cid);if(a)return{error:`${a.number} is still active at ${cname}. Finish it first.`};
        const x=list.find(z=>z.id===id);if(!x||(x.status!=='Waiting'&&x.status!=='No Show'))return{error:'This ticket can no longer be called.'};
        const c=counterById(cid);if(x.status==='Waiting'&&c&&c.services&&c.services.length&&!c.services.includes(x.serviceId)&&!confirm(`${cname} is not set up for "${x.serviceName}". Call anyway?`))return{error:'Call cancelled.'};
        const was=x.status;markCalled(x,cid);return{ticket:x,action:was==='No Show'?'Recalled (from No Show)':'Called (selected)',detail:cname};
      });ann=true;
    }else if(kind==='cancel'){
      const reason=prompt(`Cancel ticket ${t.number}? Enter a reason (optional):`,'');if(reason===null)return;
      r=await ticketTx(list=>{const x=list.find(z=>z.id===id);if(!x||(x.status!=='Waiting'&&x.status!=='Called'))return{error:'This ticket can no longer be cancelled.'};
        x.status='Cancelled';x.cancelledAt=Date.now();x.cancelReason=reason;return{ticket:x,action:'Cancelled',detail:reason}});
    }
    await loadTickets();notify({type:'changed'});refreshQueue();
    if(r&&r.ticket){toast(r.ticket.number+': '+r.action,'ok');if(ann)announce(r.ticket)}
  }catch(e){toast(e.message,'err')}
}

async function runReport(){

  const L=all.filter(t=>(!f.service||t.serviceId===f.service)&&(!f.status||t.status===f.status)&&
    (!f.emp||[t.registeredBy,t.calledBy,t.servedBy,t.completedBy].includes(f.emp))).sort((a,b)=>a.registeredAt-b.registeredAt);

function summarize(L){
  const now=Date.now();
  const st=computeStats(L,now);
  const clients=new Set(L.map(t=>[t.client.first,t.client.last,t.client.phone].join('|').toLowerCase())).size;
  const group=(key)=>{const m=new Map();L.forEach(t=>{const k=key(t);if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return m};
  const row=(list)=>{const s=computeStats(list,now);return{n:list.length,completed:s.completed,cancelled:s.cancelled,noShow:s.noShow,open:s.waiting+s.called+s.serving,avgWait:s.avgWait,longest:s.longestToday,avgService:s.avgService}};
  const daily=[...group(t=>t.day)].sort((a,b)=>a[0]<b[0]?-1:1).map(([d,l])=>Object.assign({label:dayLabel(d)},row(l)));
  const bySvc=[...group(t=>t.serviceName)].map(([s,l])=>Object.assign({label:s},row(l))).sort((a,b)=>b.n-a.n);
  const hourly=Array(24).fill(0);L.forEach(t=>hourly[Math.floor(minutesOfDay(t.registeredAt)/60)]++);
  return{st,clients,daily,bySvc,hourly};
}

/* ---------- minimal XLSX writer (no external libraries) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),out=[],central=[];let off=0;
  for(const f of files){

    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,name.length,true);

const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function sheetXml(rows){
  const widths=[];rows.forEach(r=>r.forEach((v,j)=>{widths[j]=Math.min(60,Math.max(widths[j]||8,String(v??'').length+2))}));
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(widths.length)x+='<cols>'+widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  x+='<sheetData>';
  rows.forEach((r,i)=>{
    x+=`<row r="${i+1}">`;
    r.forEach((v,j)=>{
      const ref=colName(j)+(i+1),s=i===0?' s="1"':'';

      if(typeof v==='number'&&isFinite(v))x+=`<c r="${ref}"${s}><v>${v}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;

}

    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}/package/2006/relationships"><Relationship Id="rId1" Type="${ns}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}/spreadsheetml/2006/main" xmlns:r="${ns}/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${ns}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${ns}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE2E8F0"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s.rows)}))

function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

}

    <form id="addUser"><div class="row2">
      <label>Full Name<input name="name" required maxlength="50"></label><label>Username<input name="username" required maxlength="30" pattern="[A-Za-z0-9._-]+"></label>
      <label>Role<select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label>Starting PIN (4–12 digits)<input name="pin" type="password" inputmode="numeric" pattern="\\d{4,12}" required></label></div>
      <button class="btn primary">Add User</button> <span class="muted">New users must change their PIN at first sign-in.</span></form>
    <div class="help" style="margin-top:12px"><b>Administrator</b>: everything · <b>Front Desk</b>: register, print/reprint, view queue · <b>Queue Operator</b>: call, recall, serve, complete · <b>Public Display</b>: display only.</div>`;
  const admins=()=>S.users.filter(u=>u.role==='admin'&&u.active).length;
  $$('[data-urole]',el).forEach(s=>s.onchange=async()=>{
    const u=S.users.find(x=>x.id===s.dataset.urole);
    if(u.role==='admin'&&s.value!=='admin'&&admins()<=1){toast('At least one active Administrator is required.','err');return renderUsers()}
    u.role=s.value;await dbPut('users',u);await addLog('Changed user role',null,u.name+' → '+ROLES[u.role]);notify({type:'users'});toast('Role updated.','ok');
    if(u.id===S.user.id){S.user=u;render()}
  });
  $$('[data-uact]',el).forEach(c=>c.onchange=async()=>{
    const u=S.users.find(x=>x.id===c.dataset.uact);
    if(!c.checked&&(u.id===S.user.id||(u.role==='admin'&&admins()<=1))){toast('You cannot deactivate yourself or the last Administrator.','err');return renderUsers()}
    u.active=c.checked;await dbPut('users',u);await addLog(u.active?'Activated user':'Deactivated user',null,u.name);notify({type:'users'});toast('User updated.','ok');
  });
  $$('[data-upin]',el).forEach(b=>b.onclick=async()=>{
    const u=S.users.find(x=>x.id===b.dataset.upin);
    const p=prompt(`New temporary PIN for ${u.name} (4–12 digits):`);if(p===null)return;
    if(!/^\d{4,12}$/.test(p))return toast('PIN must be 4–12 digits.','err');
    u.salt=uid();u.pin=await hashPin(p,u.salt);u.mustChange=u.id!==S.user.id;await dbPut('users',u);await addLog('Reset user PIN',null,u.name);notify({type:'users'});toast('PIN reset.','ok');
  });
  $('#addUser',el).onsubmit=async e=>{
    e.preventDefault();const f=e.target;const un=f.username.value.trim().toLowerCase();
    if(S.users.some(u=>u.username===un))return toast('That username already exists.','err');
    const salt=uid();
    const u={id:uid('u'),name:f.name.value.trim(),username:un,role:f.role.value,active:true,salt,pin:await hashPin(f.pin.value,salt),mustChange:true,created:Date.now()};
    await dbPut('users',u);S.users.push(u);await addLog('Added user',null,u.name+' ('+ROLES[u.role]+')');notify({type:'users'});toast('User added.','ok');renderUsers();
  };
}

/* ---------- backup / restore ---------- */
async function exportBackup(){
  const data={app:'QMS',version:1,exportedAt:new Date().toISOString(),tickets:await dbAll('tickets'),meta:await dbAll('meta'),users:await dbAll('users'),logs:await dbAll('logs')};
  download(new Blob([JSON.stringify(data)],{type:'application/json'}),`QMS-Backup_${dayKey()}.json`);
  addLog('Downloaded full backup');
}
async function importBackup(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  let data;try{data=JSON.parse(await file.text())}catch(x){return toast('That file is not a valid backup.','err')}
  if(data.app!=='QMS'||!Array.isArray(data.tickets))return toast('That file is not a QMS backup.','err');
  if(!confirm(`Restore backup from ${data.exportedAt}? This replaces ALL current tickets, settings, users and logs on this computer.`))return;
  await new Promise((res,rej)=>{
    const t=db.transaction(['tickets','meta','users','logs'],'readwrite');
    for(const st of ['tickets','meta','users','logs']){const s=t.objectStore(st);s.clear();(data[st]||[]).forEach(r=>s.put(r))}
    t.oncomplete=res;t.onerror=()=>rej(t.error);
  });
  toast('Backup restored. Reloading…','ok');notify({type:'settings'});notify({type:'users'});notify({type:'changed'});
  setTimeout(()=>location.reload(),800);
}

/* =====================================================================
   TIMERS & START-UP
   ===================================================================== */
function startTimers(){
  setInterval(()=>{
    if(S.isDisplay){tickDisplayClock();return}
    tickHeader();tickRegister();
  },1000);
  // waiting times refresh (spec: at least every minute) + day rollover + safety sync
  setInterval(async()=>{
    const d=dayKey();
    if(S.currentDay&&d!==S.currentDay){S.currentDay=d;await closeStale();await loadTickets();refreshView();return}
    S.currentDay=d;
    if(S.isDisplay){renderDisplay();return}
    if(S.user&&S.view==='queue'){await loadTickets();refreshQueue()}
    // inactivity sign-out
    const lim=+S.settings.security.autoLogoutMin;
    if(S.user&&lim>0&&Date.now()-S.lastActivity>lim*60000)logout('Signed out after inactivity.');
  },20000);
  ['mousedown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{S.lastActivity=Date.now()},{passive:true}));
}
window.addEventListener('hashchange',()=>location.reload());
async function init(){
  if(!window.indexedDB){app.innerHTML='<p style="padding:30px">This browser does not support the local database required by the Queue Management System. Please use a current version of Chrome, Edge, Firefox or Safari.</p>';return}
  try{
    db=await openDB();
    await loadSettings();await ensureAdmin();
    S.currentDay=dayKey();
    await closeStale();await loadTickets();
    if(!S.isDisplay)restoreSession();
    render();startTimers();
  }catch(e){app.innerHTML=`<p style="padding:30px;color:#b91c1c">The system could not start: ${esc(e.message)}</p>`;console.error(e)}
}
init();
</script>
